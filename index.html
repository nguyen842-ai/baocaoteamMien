<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Quản Lý KPI Tuyến Chợ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; color: #333; overflow: hidden; }
        .dashboard-container { display: flex; height: 100vh; }
        
        /* Sidebar Form */
        .sidebar { width: 380px; background-color: #ffffff; padding: 20px; box-shadow: 3px 0 10px rgba(0,0,0,0.05); z-index: 10; overflow-y: auto; }
        .sidebar h2 { color: #1e3a8a; font-size: 1.3rem; margin-bottom: 20px; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; position: sticky; top: 0; background: white; z-index: 11; }
        .section-title { font-size: 0.95rem; color: #2563eb; margin: 15px 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 5px; }
        .form-group { margin-bottom: 12px; }
        .form-group-row { display: flex; gap: 8px; }
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.8rem; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; background-color: #fff; font-size: 0.9rem; }
        .form-group input:focus, .form-group select:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        button:hover { background-color: #1d4ed8; }
        .secondary-btn { background-color: #dc2626; margin-top: 15px; }
        .secondary-btn:hover { background-color: #b91c1c; }
        
        /* Main Content */
        .main-content { flex: 1; padding: 25px; overflow-y: auto; }
        .main-content h1 { font-size: 1.8rem; color: #1e293b; margin-bottom: 20px; }
        
        /* KPI Cards */
        .kpi-container { display: flex; gap: 20px; margin-bottom: 25px; }
        .kpi-card { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 4px solid #3b82f6; }
        .kpi-card h3 { font-size: 1.05rem; color: #1e3a8a; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        .kpi-stats { display: flex; justify-content: space-between; text-align: center; }
        .kpi-item { flex: 1; }
        .kpi-val { font-size: 1.4rem; font-weight: bold; color: #059669; }
        .kpi-target { font-size: 0.85rem; color: #64748b; margin-top: 5px; }
        .kpi-vol { font-size: 1.4rem; font-weight: bold; color: #2563eb; }

        /* Bảng Báo Cáo */
        .table-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .table-header h3 { color: #475569; margin: 0; }
        .export-btn { width: auto; margin: 0; background-color: #10b981; padding: 8px 15px; font-size: 0.9rem; }
        .export-btn:hover { background-color: #059669; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 10px; text-align: center; border: 1px solid #e2e8f0; vertical-align: middle; }
        th { background-color: #f8fafc; color: #334155; font-weight: 600; position: sticky; top: 0; z-index: 2; }
        tr:hover { background-color: #f1f5f9; }
        .delete-btn { background-color: #ef4444; padding: 5px 10px; font-size: 0.75rem; margin: 0; width: auto; }
        .delete-btn:hover { background-color: #dc2626; }
        .highlight-target { background-color: #fffbeb; font-weight: bold; color: #d97706; }
        .highlight-actual { background-color: #ecfdf5; font-weight: bold; color: #059669; }
        .product-list { text-align: left; line-height: 1.6; }
        .no-product { color: #94a3b8; font-style: italic; }
    </style>
</head>

    <div class="dashboard-container">
        <!-- BÊN TRÁI: FORM NHẬP -->
        <div class="sidebar">
            <h2>Báo Cáo Số Liệu Chợ</h2>
            <form id="market-form">
                
                <h3 class="section-title">Thông tin chung</h3>
                <div class="form-group-row">
                    <div class="form-group" style="flex: 1;">
                        <label>Ngày làm việc:</label>
                        <input type="date" id="work-date" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Nhân Viên:</label>
                    <select id="staff-name" required></select>
                </div>

                <div class="form-group">
                    <label>Tên Chợ:</label>
                    <input type="text" id="market-name" list="market-suggestions" required placeholder="Gõ để tìm chợ...">
                    <datalist id="market-suggestions"></datalist>
                </div>
                
                <h3 class="section-title">Khách Hàng trên Tuyến</h3>
                <div class="form-group-row">
                    <div class="form-group"><label>KH Đang PV:</label><input type="number" id="kh-tuyen" min="0" required value="0"></div>
                    <div class="form-group"><label>KH Mở Mới:</label><input type="number" id="kh-moi" min="0" required value="0"></div>
                    <div class="form-group"><label>KH Lên Đơn:</label><input type="number" id="kh-don" min="0" required value="0"></div>
                </div>

                <h3 class="section-title">Sản Phẩm Bán (Thùng)</h3>
                <div class="products-grid">
                    <div class="form-group"><label>Tươi 200gr:</label><input type="number" id="p1" min="0" value="0"></div>
                    <div class="form-group"><label>Tươi 450gr:</label><input type="number" id="p2" min="0" value="0"></div>
                    <div class="form-group"><label>Tươi 1kg:</label><input type="number" id="p3" min="0" value="0"></div>
                    <div class="form-group"><label>Tươi 3kg:</label><input type="number" id="p4" min="0" value="0"></div>
                    <div class="form-group"><label>Khô 80gr:</label><input type="number" id="p5" min="0" value="0"></div>
                    <div class="form-group"><label>Khô 200gr:</label><input type="number" id="p6" min="0" value="0"></div>
                    <div class="form-group"><label>Khô 500gr:</label><input type="number" id="p7" min="0" value="0"></div>
                    <div class="form-group"><label>Khô 1kg:</label><input type="number" id="p8" min="0" value="0"></div>
                    <div class="form-group"><label>Dong 40gr:</label><input type="number" id="p9" min="0" value="0"></div>
                    <div class="form-group"><label>Dong 200gr:</label><input type="number" id="p10" min="0" value="0"></div>
                    <div class="form-group"><label>Dong 480gr:</label><input type="number" id="p11" min="0" value="0"></div>
                    <div class="form-group"><label>Tươi Song Lân 500gr:</label><input type="number" id="p12" min="0" value="0"></div>
                </div>

                <h3 class="section-title">Quà tặng / Khuyến mãi (FOC)</h3>
                <div class="form-group-row">
                    <div class="form-group"><label>FOC M150 (Lon):</label><input type="number" id="foc-m150" min="0" required value="0"></div>
                    <div class="form-group"><label>FOC Miến khô (Gói):</label><input type="number" id="foc-mien-kho" min="0" required value="0"></div>
                </div>

                <button type="submit" id="add-btn">Thêm Số Liệu Chợ</button>
            </form>
            <button id="clear-btn" class="secondary-btn">Xóa Toàn Bộ Dữ Liệu Bộ Nhớ Tạm</button>
        </div>

        <!-- BÊN PHẢI: BÁO CÁO & KPI -->
        <div class="main-content">
            <h1>Dashboard Quản Lý KPI Tuyến Chợ</h1>
            
            <div class="kpi-container" id="kpi-board">
                <!-- Data đổ từ JS -->
            </div>

            <div class="table-box">
                <div class="table-header">
                    <h3>Bảng Báo Cáo Chi Tiết</h3>
                    <button class="export-btn" onclick="exportToExcel()">📥 Xuất File Excel</button>
                </div>
                
                <div class="table-responsive">
                    <table id="data-table">
                        <thead>
                            <tr>
                                <th>Ngày</th>
                                <th>Nhân Viên</th>
                                <th>Tên Chợ</th>
                                <th>Đang PV</th>
                                <th class="highlight-target">Mục Tiêu</th>
                                <th class="highlight-actual">Thực Tế</th>
                                <th>Lên Đơn</th>
                                <th style="background-color:#dbeafe; color:#1e40af;">Tổng SP</th>
                                <th style="text-align: left; min-width: 200px;">Chi Tiết SP Đã Bán</th>
                                <th>M150 (Lon)</th>
                                <th>Miến (Gói)</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data đổ từ JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

                const products = [
                    {name: 'MT 200g', val: item.p1}, {name: 'MT 450g', val: item.p2}, {name: 'MT 1kg', val: item.p3}, {name: 'MT 3kg', val: item.p4},
                    {name: 'MK ĐX 80g', val: item.p5}, {name: 'MK ĐX 200g', val: item.p6}, {name: 'MK ĐX 500g', val: item.p7}, {name: 'MK ĐX 1kg', val: item.p8},
                    {name: 'M.Dong 40g', val: item.p9}, {name: 'M.Dong 200g', val: item.p10}, {name: 'M.Dong 480g', val: item.p11}, {name: 'MT S.Lân 500g', val: item.p12}
                ];
                let soldStr = products.filter(p => p.val > 0).map(p => `• <b>${p.name}</b>: ${p.val}`).join('<br>');
                if(!soldStr) soldStr = '<span class="no-product">Chưa có SP</span>';

                const dateObj = new Date(item.date);
                const dateStr = `${('0'+dateObj.getDate()).slice(-2)}/${('0'+(dateObj.getMonth()+1)).slice(-2)}`;

                tableHTML += `
                    <tr>
                        <td style="color:#64748b;">${dateStr}</td>
                        <td>${item.staff}</td>
                        <td style="font-weight:bold;">${item.name}</td>
                        <td>${item.khTuyen}</td>
                        <td class="highlight-target">${target}</td>
                        <td class="highlight-actual">${item.khMoi}</td>
                        <td>${item.khDon}</td>
                        <td style="color:#1d4ed8; font-weight:bold;">${totalSP}</td>
                        <td class="product-list">${soldStr}</td>
                        <td>${item.focM150}</td>
                        <td>${item.focMien}</td>
                        <td><button class="delete-btn" onclick="deleteMarket(${index})">Xóa</button></td>
                    </tr>
                `;
            });

            if(marketData.length > 0) {
                tableHTML += `
                    <tr style="background-color: #f8fafc; border-top: 2px solid #cbd5e1;">
                        <td colspan="3" style="text-align: right; font-weight: bold; color: #1e293b;">TỔNG CỘNG ĐÃ NHẬP:</td>
                        <td style="font-weight:bold;">${sumTuyen}</td>
                        <td class="highlight-target">${sumTarget}</td>
                        <td class="highlight-actual">${sumMoi}</td>
                        <td style="font-weight:bold;">${sumDon}</td>
                        <td style="color:#1d4ed8; font-weight:bold;">${sumTotalSP}</td>
                        <td>-</td>
                        <td style="font-weight:bold;">${sumM150}</td>
                        <td style="font-weight:bold;">${sumMien}</td>
                        <td></td>
                    </tr>
                `;
            }

            document.querySelector('#data-table tbody').innerHTML = tableHTML;

            // 2. CẬP NHẬT THẺ KPI
            let kpiHTML = '';
            ALL_STAFFS.forEach(staff => {
                let staffData = marketData.filter(d => d.staff === staff);
                let actualMoi = staffData.reduce((sum, d) => sum + d.khMoi, 0);
                let totalSP = staffData.reduce((sum, d) => sum + (d.p1+d.p2+d.p3+d.p4+d.p5+d.p6+d.p7+d.p8+d.p9+d.p10+d.p11+d.p12), 0);
                let targetMoi = staffData.reduce((sum, d) => sum + getTargetForMarket(d.staff, d.name), 0);

                kpiHTML += `
                    <div class="kpi-card">
                        <h3>🧑‍💼 ${staff}</h3>
                        <div class="kpi-stats">
                            <div class="kpi-item">
                                <div class="kpi-val">${actualMoi}</div>
                                <div class="kpi-target">Mở Mới<br>(Mục Tiêu: ${targetMoi})</div>
                            </div>
                            <div class="kpi-item">
                                <div class="kpi-vol">${totalSP}</div>
                                <div class="kpi-target">Tổng Sản Lượng<br>(Thùng)</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('kpi-board').innerHTML = kpiHTML;
        }

        // --- SUBMIT FORM & GỬI LÊN GOOGLE SHEETS ---
        document.getElementById('market-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('add-btn');
            btn.innerText = 'Đang gửi dữ liệu lên mây...';
            btn.disabled = true;

            const getNum = (id) => parseInt(document.getElementById(id).value) || 0;
            
            const dateInput = document.getElementById('work-date').value;
            const dateObj = new Date(dateInput);
            const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            const strThu = days[dateObj.getDay()];
            const strNgay = dateObj.getDate();
            const strThang = dateObj.getMonth() + 1;
            const strNam = dateObj.getFullYear();

            const staff = document.getElementById('staff-name').value;
            const name = document.getElementById('market-name').value;
            const target = getTargetForMarket(staff, name);
            
            const p1=getNum('p1'), p2=getNum('p2'), p3=getNum('p3'), p4=getNum('p4');
            const p5=getNum('p5'), p6=getNum('p6'), p7=getNum('p7'), p8=getNum('p8');
            const p9=getNum('p9'), p10=getNum('p10'), p11=getNum('p11'), p12=getNum('p12');
            const totalSP = p1+p2+p3+p4+p5+p6+p7+p8+p9+p10+p11+p12;

            const newMarket = {
                date: dateInput,
                thu: strThu, ngay: strNgay, thang: strThang, nam: strNam,
                staff: staff, name: name, target: target, totalSP: totalSP,
                khTuyen: getNum('kh-tuyen'), khMoi: getNum('kh-moi'), khDon: getNum('kh-don'),
                p1: p1, p2: p2, p3: p3, p4: p4, p5: p5, p6: p6, p7: p7, p8: p8,
                p9: p9, p10: p10, p11: p11, p12: p12,
                focM150: getNum('foc-m150'), focMien: getNum('foc-mien-kho')
            };

            // Lưu nội bộ
            marketData.push(newMarket);
            updateDashboard();

            // Đẩy lên Google Sheets
            if(GOOGLE_SCRIPT_URL !== 'https://script.google.com/macros/s/AKfyc.../exec') {
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newMarket)
                })
                .then(() => {
                    document.querySelectorAll('#market-form input[type="number"]').forEach(inp => inp.value = 0);
                    document.getElementById('market-name').value = '';
                    document.getElementById('work-date').value = dateInput;
                    btn.innerText = 'Thêm Số Liệu Chợ';
                    btn.disabled = false;
                })
                .catch(error => {
                    console.error('Lỗi:', error);
                    btn.innerText = 'Thêm Số Liệu Chợ';
                    btn.disabled = false;
                    alert("Đã lưu nội bộ nhưng lỗi kết nối Google Sheets!");
                });
            } else {
                // Giả lập lưu nếu chưa cài link
                document.querySelectorAll('#market-form input[type="number"]').forEach(inp => inp.value = 0);
                document.getElementById('market-name').value = '';
                document.getElementById('work-date').value = dateInput;
                btn.innerText = 'Thêm Số Liệu Chợ';
                btn.disabled = false;
            }
        });

        function deleteMarket(index) {
            if(confirm("Bạn có chắc chắn muốn xóa khỏi hiển thị? (Dữ liệu đã đẩy lên Google Sheets sẽ không bị xóa)")) { 
                marketData.splice(index, 1); 
                updateDashboard(); 
            }
        }

        document.getElementById('clear-btn').addEventListener('click', function() {
            if(confirm("Xóa toàn bộ dữ liệu đang hiển thị tạm trên máy này?")) { 
                marketData = []; 
                updateDashboard(); 
            }
        });

        // --- HÀM XUẤT EXCEL (CSV) ---
        function exportToExcel() {
            if(marketData.length === 0) { alert("Chưa có dữ liệu để xuất!"); return; }
            
            let csvContent = "\uFEFF"; 
            
            let headers = [
                "Ngày", "Nhân Viên", "Tên Chợ", "KH đang phục vụ", "Mục Tiêu Mở Mới", "Thực Tế KH Mở Mới", "KH Lên Đơn", "Tổng SP Bán",
                "Tươi 200g", "Tươi 450g", "Tươi 1kg", "Tươi 3kg", "Khô 80g", "Khô 200g", "Khô 500g", "Khô 1kg", 
                "Dong 40g", "Dong 200g", "Dong 480g", "Tươi Song Lân 500g", "FOC M150 (lon)", "FOC Miến (Gói)"
            ];
            csvContent += headers.map(h => `"${h}"`).join(",") + "\n";

            marketData.forEach(item => {
                let target = getTargetForMarket(item.staff, item.name);
                let totalSP = item.p1 + item.p2 + item.p3 + item.p4 + item.p5 + item.p6 + item.p7 + item.p8 + item.p9 + item.p10 + item.p11 + item.p12;
                
                let row = [
                    item.date, item.staff, item.name, item.khTuyen, target, item.khMoi, item.khDon, totalSP,
                    item.p1, item.p2, item.p3, item.p4, item.p5, item.p6, item.p7, item.p8, 
                    item.p9, item.p10, item.p11, item.p12, item.focM150, item.focMien
                ];
                csvContent += row.map(v => `"${v}"`).join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Bao_Cao_Tuyen_Cho_${new Date().toLocaleDateString('vi-VN').replace(/\//g,'-')}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        updateDashboard();
    </script>
</body>
</html>
